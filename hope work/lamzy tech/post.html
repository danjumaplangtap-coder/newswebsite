<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header >
        <div class="logo">The margin</div>
       <nav>
        <a href="#">posts</a>
        <button>write</button>
        <div>
            <img src="image/Layout (1).png">
        </div>
       </nav>
    </header>
    

        <section class="post-form">
            <section class="page">
                <h1>Write a new post</h1>
                <P>share an idea, an essay, a reflection.</P>
                <p>Title</p>
                <input type="title" placeholder="something worth reading">
                <label>Excerpt (optional — generated from content if blank)</label>
                <input type="text" placeholder="A sentence or two that draws the reader in.">
                <div class="form">
                    <div class="inform">
                        <label class="home"category></label>
                        <input type="text" placeholder="culture">
                    </div>
                    <div class="reader">
                        <label>read time (minutes)</label>
                        <input type="text" placeholder="read time (minutes)">
                    </div>
                </div>
                <div class="place">
                    <p>content</p>
                    <textarea placeholder="Start writing...Separate paragraphs with a blank line. Wrap *words* in asterisks for italics." rows=20></textarea>
                </div>
                <div class="meta">
                    <button>publish post</button>
                    <p>cancel</p>
                </div>
            </section>
        </section>
        

   
    <section class="footer">
        <h3>the margin</h3>
        <P>a place for ideas worth keeping.</P>
        <p>sign out</p>
    </section>
    
</body>
</html>
