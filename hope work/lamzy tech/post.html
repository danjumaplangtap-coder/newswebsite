<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <a class="logo" href="../../index.html">The margin</a>
    <nav id="not-login" aria-label="Logged out navigation">
     <a href="../../index.html#posts">Post</a>
     <a href="../my project 2/loggin.html">Sign in</a>
    <a class="header-action" href="../register.html">Get started</a>
    </nav>
    <nav id="login" hidden aria-label="Logged in navigation">
     <a href="../../index.html#posts">Post</a>
     <a href="../my project 2/loggin.html">Sign in</a>
     <button class="write-post" style="background-color:#b8651a; color: white; border-radius: 16px; text-decoration: none;" href="post.html">Write</button>
     <!-- <button type="button" data-logout data-home="../../index.html">Log out</button> -->
       </nav>
    </header>
    

        <section class="post-form">
            <form id="postForm" class="page">
                <h1>Write a new post</h1>
                <P>share an idea, an essay, a reflection.</P>
                <p>Title</p>
                <input id="title" type="text" placeholder="something worth reading" required>
                <label>Excerpt (optional — generated from content if blank)</label>
                <input id="excerpt" type="text" placeholder="A sentence or two that draws the reader in.">
                <div class="form">
                    <div class="inform">
                        <label class="home"category></label>
                        <input id="category" type="text" placeholder="culture" required>
                    </div>
                    <div class="reader">
                        <label>read time (minutes)</label>
                        <input id="readTime" type="number" min="1" placeholder="read time (minutes)">
                    </div>
                </div>
                <div class="place">
                    <p>content</p>
                    <textarea id="content" placeholder="Start writing...Separate paragraphs with a blank line. Wrap *words* in asterisks for italics." rows="20" required></textarea>
                </div>
                <div class="meta">
                    <button id="publishButton" type="submit">publish post</button>
                    <a href="../../index.html">cancel</a>
                </div>
            </form>
        </section>
        

   
    <section class="footer">
        <h3>the margin</h3>
        <P>a place for ideas worth keeping.</P>
        <button id="logoutButton" type="button">sign out</button>
    </section>
    
    <script src="../../js/api.js"></script>
    <script>
        document.getElementById("postForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const button = document.getElementById("publishButton");
            button.disabled = true;
            button.textContent = "publishing...";

            try {
                await createPost({
                    title: document.getElementById("title").value.trim(),
                    excerpt: document.getElementById("excerpt").value.trim(),
                    category: document.getElementById("category").value.trim(),
                    readTime: Number(document.getElementById("readTime").value) || 1,
                    content: document.getElementById("content").value.trim()
                });
                window.location.href = "../../index.html";
            } catch (error) {
                alert(error.message);
                button.disabled = false;
                button.textContent = "publish post";
            }
        });

        document.getElementById("logoutButton").addEventListener("click", () => {
            clearSession();
            window.location.href = "../../index.html";
        });
    </script>
</body>
</html>
