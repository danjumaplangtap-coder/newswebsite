<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <header class="navbar">

     <nav>
        <a href="../lamzy tech/post.html">post</a>

     </nav>

            <section class="inform">
                <form id="loginForm">
                    <h1>welcome back.</h1>
                    <p>Sign in to continue writing and reading.</p>
                    <label class="email">EMAIL</label>
                <input id="email" type="email" placeholder="Danjumaplangtap@gmail.com" required>
                <label class="password">PASSWORD</label> 
                <input id="password" type="password" placeholder="enter your password" required>
                 <button id="loginButton" type="submit">sign in</button>
                 <label class="type">Need an account? <a class="sign-up" href="../register.html">Create one</a></label>
                </form>
        
                    </section>
    <footer class="footer">
        <div class="footer-logo">the margin</div>
        <div class="footer-text">
            A place for ideas worth keeping.
        </div>
    </footer>
    <script src="../../js/api.js"></script>
    <script>
    async function loginStudent(email, password) {
  const data = await apiRequest("/api/auth/login", {
    method: "POST",
    body: JSON.stringify({ email, password }),
  });

  saveSession(data);

  return data.student;
}
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const loginButton = document.getElementById("loginButton");
  loginButton.textContent = "Signing in...";
  loginButton.disabled = true;
  try {
    await loginStudent(
      document.getElementById("email").value,
      document.getElementById("password").value
    );
    window.location.href = "../../index.html";
  } catch (err) {
    alert(err.message); // e.g. "Invalid email or password"      
  } finally {
    loginButton.textContent = "sign in";
    loginButton.disabled = false;
  }
});
</script>
